# Standalone Docker Compose only; merge after the matching base template.
# Keep these quotas consistent with deploy.resources.limits.cpus in the base.
# Do not include this override when deploying a Docker Swarm stack.
services:
  vmagent:
    cpus: '${PROM_AGENT_CPU_LIMIT:-0.20}'
    cpu_shares: 512
    labels:
      #### -- Define Unraid ident labels
      net.unraid.docker.managed: 'dockerman'
      net.unraid.docker.icon: 'https://github.com/VictoriaMetrics.png'
      net.unraid.docker.webui: 'http://[IP]:[PORT:8429]/targets'

  node-exporter:
    cpus: '${NODE_EXPORTER_CPU_LIMIT:-0.20}'
    cpu_shares: 512
    labels:
      #### -- Define Unraid ident labels
      net.unraid.docker.managed: 'dockerman'
      net.unraid.docker.icon: 'https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/prometheus.png'

  cadvisor:
    cpus: '${CADVISOR_CPU_LIMIT:-0.20}'
    cpu_shares: 512
    labels:
      #### -- Define Unraid ident labels
      net.unraid.docker.managed: 'dockerman'
      net.unraid.docker.icon: 'https://raw.githubusercontent.com/selfhosters/unRAID-CA-templates/master/templates/img/cadvisor.png'
      net.unraid.docker.webui: 'http://[IP]:[PORT:8080]/'
